# Manual / comment-triggered OpenCode (optional).
# Comment on a PR: /opencode review this PR
# Or run from Actions tab → "OpenCode On Demand" → Run workflow

name: OpenCode On Demand

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: Custom instruction for OpenCode
        required: false
        default: |
          Read AI_REVIEW.md and review the latest changes in this pull request.
          Post a markdown summary comment with high-confidence findings only.

jobs:
  opencode:
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: anthropic/claude-sonnet-4-5
          agent: plan
          use_github_token: true
          share: false
          prompt: |
            Read AI_REVIEW.md and docs/REVIEW_PROJECT_CONTEXT.md first.

            User instruction:
            ${{ github.event_name == 'workflow_dispatch' && inputs.prompt || github.event.comment.body }}
