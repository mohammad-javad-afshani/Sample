# Automated inline PR review using OpenCode CLI + GitHub Reviews API.
# Setup: docs/OPENCODE_AI_REVIEW_SETUP.md

name: AI Code Review (OpenCode Inline)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: opencode-inline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inline-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install OpenCode CLI
        run: npm install -g opencode-ai@latest

      - name: Build numbered diff context
        run: |
          chmod +x .github/scripts/build-review-context.sh
          bash .github/scripts/build-review-context.sh \
            "${{ github.base_ref }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Run OpenCode review
        id: opencode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set +e
          PROMPT="$(cat .github/prompts/inline-review-prompt.md)"
          opencode run --title "PR #${{ github.event.pull_request.number }} inline review" "$PROMPT" \
            > opencode-raw.txt 2>&1
          OPENCODE_EXIT=$?
          set -e
          python3 .github/scripts/normalize-review-json.py opencode-raw.txt review.json
          echo "exit_code=$OPENCODE_EXIT" >> "$GITHUB_OUTPUT"
          if [ "$OPENCODE_EXIT" != "0" ]; then
            echo "::warning::OpenCode exited with code $OPENCODE_EXIT (continuing if review.json exists)"
          fi

      - name: Post inline comments on PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_JSON: review.json
        run: python3 .github/scripts/post-inline-review.py

      - name: Upload review artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-review-${{ github.event.pull_request.number }}
          path: |
            review.json
            opencode-raw.txt
            .review-context/diff.patch
            .review-context/INDEX.md
          retention-days: 14
