# Automated inline PR review using OpenAI + GitHub Reviews API.
# Setup: docs/OPENCODE_AI_REVIEW_SETUP.md

name: AI Code Review (OpenCode Inline)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: opencode-inline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inline-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build numbered diff context
        run: |
          chmod +x .github/scripts/build-review-context.sh
          bash .github/scripts/build-review-context.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Generate review JSON
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REVIEW_MODEL: gpt-4o
          REVIEW_ENGINE: openai
        run: |
          chmod +x .github/scripts/run-inline-review.sh
          bash .github/scripts/run-inline-review.sh review.json "PR #${{ github.event.pull_request.number }} inline review"

      - name: Post inline comments on PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_JSON: review.json
        run: python3 .github/scripts/post-inline-review.py

      - name: Upload review artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-review-${{ github.event.pull_request.number }}
          path: |
            review.json
            opencode-raw.txt
            opencode-stderr.txt
            .review-context/diff.patch
            .review-context/INDEX.md
            .review-context/valid-lines.json
          retention-days: 14
          if-no-files-found: ignore
